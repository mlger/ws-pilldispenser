name: Feature request
description: Propose an improvement.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - firmware-main
        - firmware-coproc
        - cloud
        - android-app
        - web-flasher
        - tools / CI
        - docs
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: safety
    attributes:
      label: Safety impact
      options:
        - label: This feature can change dose timing or dose count (FMEA review required)
