# dependency-review — PR dependency gate (spec C6).
# Fails on high/critical vulnerabilities and denies GPL-3.0 for the app.
# Requires a public repository (or GHAS) — self-skips on private with a notice.
name: dependency-review

on:
  pull_request:

permissions: {}

jobs:
  notice:
    name: availability notice
    if: github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain skip
        run: |
          echo "::notice::Dependency review requires a public repository or GitHub Advanced Security. Skipping."

  review:
    name: review dependencies
    if: github.event.repository.private == false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0
          comment-summary-in-pr: on-failure
