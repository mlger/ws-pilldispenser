# ci-android — companion app CI (spec C3).
#
# Acceptance criteria: no new lint/detekt issues (baseline committed), unit
# tests green, debug APK artifact uploaded. Release builds happen only in
# release.yml inside the `android-release` environment.
#
# Phase 5 activates this workflow (android-app is a placeholder today);
# jobs self-skip until a Gradle project exists.
name: ci-android

on:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/ci-android.yml'
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/ci-android.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: detect gradle project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: filter
        run: |
          if [ -n "$(find android-app -maxdepth 1 -name 'settings.gradle*' -print -quit 2>/dev/null)" ]; then
            echo "src=true" >> "$GITHUB_OUTPUT"
          else
            echo "src=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: android build + checks
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up JDK (Temurin 21)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        # VERIFY: pin gradle/actions/setup-gradle to a full SHA when Phase 5 lands
        # (tracked in docs/ci-cd.md VERIFY appendix).
        uses: gradle/actions/setup-gradle@v4
      - name: Checks and debug build
        run: |
          cd android-app
          ./gradlew ktlintCheck detekt lint testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 14
