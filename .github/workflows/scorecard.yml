# Scorecard — supply-chain posture (spec Section B, optional).
# Public repositories only; self-skips on private with a notice.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '40 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  notice:
    name: availability notice
    if: github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain skip
        run: |
          echo "::notice::Scorecard results publishing requires a public repository. Skipping."

  analyze:
    name: scorecard analysis
    if: github.event.repository.private == false
    permissions:
      contents: read
      security-events: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: results.sarif
