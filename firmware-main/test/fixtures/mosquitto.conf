# Mosquitto broker config for QEMU MQTT tests (Phase 4).
# The firmware connects through QEMU user networking to 10.0.2.2 (the host
# gateway). TLS uses the throwaway test CA generated by gen_test_certs.sh —
# never a production CA (docs/security-keys.md).
listener 8883
protocol mqtt

cafile   /etc/mosquitto/test-ca/ca.crt
certfile /etc/mosquitto/test-ca/server.crt
keyfile  /etc/mosquitto/test-ca/server.key

# Device certs are provisioned at the bench, never in CI.
require_certificate true
use_identity_as_username true

# Deterministic behavior for tests: no persistence, low keepalive grace.
persistence false
log_type all
connection_messages true
